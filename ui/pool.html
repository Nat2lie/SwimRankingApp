<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      -webkit-mask-image:
        linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
        linear-gradient(to bottom, #000 0, #000 84%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
        linear-gradient(to bottom, #000 0, #000 84%, transparent 100%);
      mask-composite: intersect;
    }
    .caption {
      position: absolute;
      left: 18px;
      bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d5e8ef;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .caption i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ec8d6;
      box-shadow: 0 0 10px #4ec8d6;
    }
    .fallback {
      margin: 24px;
      color: #d5e8ef;
    }
  </style>
</head>
<body>
  <div class="caption"><i></i>Freestyle lane</div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    const compact = __COMPACT__ === 1;
    const theme = "__THEME__";
    const lightMode = theme === "light" || (
      theme === "system" && window.matchMedia("(prefers-color-scheme: light)").matches
    );
    const BG = new THREE.Color(lightMode ? "#d7e4e9" : "#0b1821");

    if (lightMode) {
      document.querySelector(".caption").style.color = "#29434f";
    }
    const FOG_NEAR = 4.5;
    const FOG_FAR = 14;
    const LANE = 1.9;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const scene = new THREE.Scene();
    scene.background = BG;
    scene.fog = new THREE.Fog(BG, FOG_NEAR, FOG_FAR);

    const camera = new THREE.PerspectiveCamera(compact ? 40 : 34, 1, 0.1, 40);
    const camBase = compact ? new THREE.Vector3(0.6, 1.4, 4.6) : new THREE.Vector3(0.9, 1.2, 3.8);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true });
    } catch (error) {
      document.body.innerHTML = '<p class="fallback">This lane view needs WebGL.</p>';
      throw error;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xcdefff, 0x0a3a4c, 1.1));
    const sun = new THREE.DirectionalLight(0xfff1dc, 1.6);
    sun.position.set(2.5, 5, -3);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x8fdcec, 0.55);
    fill.position.set(-2, 1.5, 4);
    scene.add(fill);

    // Shared uniforms: the swimmer stays put and the pool slides past by uOffset.
    const shared = {
      uTime: { value: 0 },
      uOffset: { value: 0 },
      uKick: { value: 0 },
      uFog: { value: BG },
      uFogNear: { value: FOG_NEAR },
      uFogFar: { value: FOG_FAR },
    };

    const glslCommon = `
      uniform float uTime;
      uniform float uOffset;
      uniform float uKick;
      uniform vec3 uFog;
      uniform float uFogNear;
      uniform float uFogFar;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vnoise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      float fogAmount(vec3 world) {
        return clamp((distance(world, cameraPosition) - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
      }
    `;

    const glslWater = `
      float swell(vec2 p) {
        float X = p.x + uOffset;
        float Z = p.y;
        float t = uTime;
        return 0.013 * sin(X * 1.05 + Z * 0.35 + t * 1.3)
             + 0.008 * sin(X * 2.2 - Z * 1.6 + t * 1.8)
             + 0.005 * sin(X * 4.3 + Z * 3.1 - t * 2.4)
             + 0.0025 * sin(X * 8.1 - Z * 6.3 + t * 3.3)
             + 0.0012 * sin(X * 14.7 + Z * 9.2 - t * 4.6);
      }
      float wake(vec2 p, out float foam) {
        vec2 q = p - vec2(0.74, 0.0);
        float bow = exp(-(q.x * q.x * 12.0 + q.y * q.y * 22.0));
        float behind = 0.72 - p.x;
        float trail = smoothstep(-0.1, 0.35, behind);
        float spread = abs(p.y) - max(behind, 0.0) * 0.3 - 0.15;
        float vArm = exp(-spread * spread * 70.0) * trail * exp(-max(behind, 0.0) * 0.3);
        float ripple = sin(behind * 15.0 - abs(p.y) * 8.0 + uTime * 1.5);
        float bodyZone = exp(-p.y * p.y * 16.0) * smoothstep(1.1, 0.2, abs(p.x + 0.15));
        vec2 k = p - vec2(-1.12, 0.0);
        float kickZone = exp(-(k.x * k.x * 4.0 + k.y * k.y * 24.0));
        float churn = kickZone * (0.6 + 0.4 * sin(uKick * 2.0 + p.x * 14.0));
        foam = clamp(bow * 0.7 + vArm * 0.5 + bodyZone * 0.35 + churn * 1.1, 0.0, 1.0);
        return bow * 0.05 + vArm * ripple * 0.014 - bodyZone * 0.02
             + churn * 0.018 * sin(uKick + p.x * 10.0);
      }
      float heightAt(vec2 p, out float foam) { return swell(p) + wake(p, foam); }
    `;

    // ---------- Pool floor: endless tiles, lane stripes, caustics ----------
    const floorGeo = new THREE.PlaneGeometry(44, 30, 1, 1);
    floorGeo.rotateX(-Math.PI / 2);
    const floor = new THREE.Mesh(
      floorGeo,
      new THREE.ShaderMaterial({
        uniforms: {
          ...shared,
          uTile: { value: new THREE.Color("#2a93ad") },
          uGrout: { value: new THREE.Color("#155c70") },
          uLane: { value: new THREE.Color("#082636") },
        },
        vertexShader: `
          varying vec3 vWorld;
          void main() {
            vec4 w = modelMatrix * vec4(position, 1.0);
            vWorld = w.xyz;
            gl_Position = projectionMatrix * viewMatrix * w;
          }
        `,
        fragmentShader: `
          ${glslCommon}
          uniform vec3 uTile;
          uniform vec3 uGrout;
          uniform vec3 uLane;
          varying vec3 vWorld;

          float caustic(vec2 uv, float time) {
            vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
            vec2 i = p;
            float c = 1.0;
            float inten = 0.005;
            for (int n = 0; n < 4; n++) {
              float t = time * (1.0 - (3.5 / float(n + 1)));
              i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
              c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten)));
            }
            c /= 4.0;
            c = 1.17 - pow(c, 1.4);
            return clamp(pow(abs(c), 8.0), 0.0, 1.5);
          }

          void main() {
            vec2 P = vec2(vWorld.x + uOffset, vWorld.z);

            vec2 cell = P / 0.3;
            vec2 fw = fwidth(cell);
            vec2 d = abs(fract(cell) - 0.5);
            vec2 g = smoothstep(0.46 - fw, 0.46 + fw, d);
            vec3 col = uTile * (0.93 + 0.12 * hash(floor(cell)));
            col = mix(col, uGrout, max(g.x, g.y));

            float zl = P.y - ${LANE.toFixed(2)} * floor(P.y / ${LANE.toFixed(2)} + 0.5);
            float lw = fwidth(P.y);
            float lane = 1.0 - smoothstep(0.11 - lw, 0.11 + lw, abs(zl));
            col = mix(col, uLane, lane * 0.92);

            vec2 s = vWorld.xz - vec2(-0.25, -0.2);
            float shadow = exp(-(s.x * s.x * 1.1 + s.y * s.y * 12.0)) * 0.42;

            float cs = caustic(P * 0.38, uTime * 0.5) * 0.8
                     + caustic(P * 0.21 + 3.1, uTime * 0.37) * 0.45;
            col *= 0.72;
            col += cs * vec3(0.55, 0.92, 1.0) * 0.42 * (1.0 - shadow * 1.6);
            col *= 1.0 - shadow;

            col = mix(col, uFog, fogAmount(vWorld));
            gl_FragColor = vec4(col, 1.0);
            #include <colorspace_fragment>
          }
        `,
      })
    );
    floor.position.set(0, -1.15, -10);
    scene.add(floor);

    // ---------- Water surface: swell + swimmer wake + foam ----------
    const waterGeo = new THREE.PlaneGeometry(44, 30, 300, 160);
    waterGeo.rotateX(-Math.PI / 2);
    waterGeo.translate(0, 0, -10);
    const water = new THREE.Mesh(
      waterGeo,
      new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          ...shared,
          uDeep: { value: new THREE.Color("#07465c") },
          uSky: { value: new THREE.Color("#4f9fb4") },
          uSun: { value: sun.position.clone().normalize() },
        },
        vertexShader: `
          ${glslCommon}
          ${glslWater}
          varying vec3 vWorld;
          void main() {
            vec3 p = position;
            float foam;
            p.y += heightAt(p.xz, foam);
            vec4 w = modelMatrix * vec4(p, 1.0);
            vWorld = w.xyz;
            gl_Position = projectionMatrix * viewMatrix * w;
          }
        `,
        fragmentShader: `
          ${glslCommon}
          ${glslWater}
          uniform vec3 uDeep;
          uniform vec3 uSky;
          uniform vec3 uSun;
          varying vec3 vWorld;
          void main() {
            vec2 p = vWorld.xz;
            float e = 0.015;
            float foam, f1, f2;
            float h = heightAt(p, foam);
            float hx = heightAt(p + vec2(e, 0.0), f1);
            float hz = heightAt(p + vec2(0.0, e), f2);
            vec3 N = normalize(vec3(h - hx, e, h - hz));
            vec3 V = normalize(cameraPosition - vWorld);

            float fres = 0.04 + 0.96 * pow(1.0 - max(dot(N, V), 0.0), 4.0);
            vec3 col = mix(uDeep, uSky, clamp(fres * 1.6, 0.0, 1.0));

            vec3 H = normalize(uSun + V);
            float nh = max(dot(N, H), 0.0);
            float spec = pow(nh, 320.0) * 2.4 + pow(nh, 40.0) * 0.12;

            vec2 fp = vec2(p.x + uOffset, p.y);
            float n = vnoise(fp * 13.0 + vec2(0.0, uTime * 0.7)) * 0.6
                    + vnoise(fp * 29.0 - uTime * 1.1) * 0.4;
            float foamMask = smoothstep(0.28, 0.72, foam * (0.45 + n));

            col += vec3(1.0, 0.97, 0.9) * spec;
            col = mix(col, vec3(0.9, 0.97, 1.0), foamMask * 0.85);
            float alpha = clamp(0.2 + fres * 0.75 + foamMask * 0.7 + spec, 0.0, 0.96);

            float fog = fogAmount(vWorld);
            col = mix(col, uFog, fog);
            alpha = mix(alpha, 1.0, fog);
            gl_FragColor = vec4(col, alpha);
            #include <colorspace_fragment>
          }
        `,
      })
    );
    scene.add(water);

    function swellJS(x, z, t, offset) {
      const X = x + offset;
      return 0.013 * Math.sin(X * 1.05 + z * 0.35 + t * 1.3)
           + 0.008 * Math.sin(X * 2.2 - z * 1.6 + t * 1.8)
           + 0.005 * Math.sin(X * 4.3 + z * 3.1 - t * 2.4);
    }

    // ---------- Lane ropes: disc floats that loop seamlessly ----------
    const ROPE_Z = [LANE / 2, -LANE / 2, -LANE * 1.5, -LANE * 2.5];
    const FLOAT_GAP = 0.085;
    const GROUP = 7;
    const PATTERN = FLOAT_GAP * GROUP * 2;
    const PER_ROPE = Math.ceil(38 / FLOAT_GAP);
    const floatGeo = new THREE.CylinderGeometry(0.052, 0.052, 0.066, 18);
    floatGeo.rotateZ(Math.PI / 2);
    const ropes = new THREE.InstancedMesh(
      floatGeo,
      new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.05 }),
      PER_ROPE * ROPE_Z.length
    );
    const blue = new THREE.Color(0x2463c4);
    const white = new THREE.Color(0xeef4f6);
    for (let r = 0; r < ROPE_Z.length; r += 1) {
      for (let i = 0; i < PER_ROPE; i += 1) {
        ropes.setColorAt(r * PER_ROPE + i, Math.floor(i / GROUP) % 2 ? white : blue);
      }
    }
    scene.add(ropes);
    const dummy = new THREE.Object3D();

    function updateRopes(t, offset) {
      const shift = offset % PATTERN;
      for (let r = 0; r < ROPE_Z.length; r += 1) {
        const z = ROPE_Z[r];
        for (let i = 0; i < PER_ROPE; i += 1) {
          const x = -19 + i * FLOAT_GAP - shift;
          dummy.position.set(x, 0.01 + swellJS(x, z, t, offset), z);
          dummy.rotation.set(Math.sin(t * 1.3 + i * 0.4) * 0.12, 0, 0);
          dummy.updateMatrix();
          ropes.setMatrixAt(r * PER_ROPE + i, dummy.matrix);
        }
      }
      ropes.instanceMatrix.needsUpdate = true;
    }

    // ---------- Swimmer ----------
    const skin = new THREE.MeshPhysicalMaterial({
      color: 0xd8a383, roughness: 0.45, clearcoat: 0.35, clearcoatRoughness: 0.35,
    });
    const suit = new THREE.MeshPhysicalMaterial({
      color: 0x0b2533, roughness: 0.32, clearcoat: 0.5, clearcoatRoughness: 0.25,
    });
    const capMat = new THREE.MeshPhysicalMaterial({
      color: 0x2fb8c9, roughness: 0.22, clearcoat: 0.8, clearcoatRoughness: 0.15,
    });
    const lensMat = new THREE.MeshPhysicalMaterial({ color: 0x0a1418, roughness: 0.05, metalness: 0.7 });

    // A tapered segment that hangs down its pivot's -y axis.
    function limb(r1, r2, len, material) {
      const pivot = new THREE.Group();
      pivot.add(new THREE.Mesh(new THREE.SphereGeometry(r1, 16, 12), material));
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, len, 16, 1, true), material);
      seg.position.y = -len / 2;
      pivot.add(seg);
      const tip = new THREE.Group();
      tip.position.y = -len;
      pivot.add(tip);
      return { pivot, tip };
    }

    function capsule(radius, length, material, x, y, scale) {
      const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, 8, 20), material);
      mesh.rotation.z = Math.PI / 2;
      mesh.position.set(x, y, 0);
      mesh.scale.set(...scale);
      return mesh;
    }

    const swimmer = new THREE.Group();
    const body = new THREE.Group();
    swimmer.add(body);

    body.add(capsule(0.135, 0.36, suit, 0.12, 0, [0.86, 1, 1.3]));
    body.add(capsule(0.12, 0.2, suit, -0.2, -0.005, [0.85, 1, 1.15]));
    body.add(capsule(0.05, 0.08, skin, 0.4, 0.01, [1, 1, 1]));

    const headPivot = new THREE.Group();
    headPivot.position.set(0.44, 0.02, 0);
    body.add(headPivot);
    const skull = new THREE.Group();
    skull.position.set(0.1, 0, 0);
    skull.scale.set(1.12, 1, 0.9);
    headPivot.add(skull);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.105, 28, 20), skin);
    skull.add(head);
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(0.111, 28, 16, 0, Math.PI * 2, 0, Math.PI * 0.62),
      capMat
    );
    cap.rotation.z = -0.8;
    skull.add(cap);
    for (const side of [1, -1]) {
      const lens = new THREE.Mesh(new THREE.SphereGeometry(0.027, 14, 10), lensMat);
      lens.scale.set(1, 0.5, 1.2);
      lens.position.set(0.046, -0.088, side * 0.042);
      skull.add(lens);
    }
    const strapTilt = new THREE.Group();
    strapTilt.rotation.z = 0.35;
    const strap = new THREE.Mesh(new THREE.TorusGeometry(0.104, 0.006, 8, 48), lensMat);
    strap.rotation.y = Math.PI / 2;
    strapTilt.add(strap);
    skull.add(strapTilt);

    function buildArm(side) {
      const upper = limb(0.048, 0.04, 0.28, skin);
      const fore = limb(0.04, 0.03, 0.25, skin);
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.042, 14, 10), skin);
      hand.scale.set(0.42, 1.35, 1);
      hand.position.y = -0.045;
      fore.tip.add(hand);
      upper.tip.add(fore.pivot);
      upper.pivot.position.set(0.28, 0.015, side * 0.175);
      body.add(upper.pivot);
      return { side, upper: upper.pivot, fore: fore.pivot, hand, prev: 0 };
    }

    function buildLeg(side) {
      const thigh = limb(0.068, 0.05, 0.36, suit);
      const shin = limb(0.05, 0.03, 0.34, skin);
      const foot = limb(0.03, 0.02, 0.14, skin);
      foot.pivot.scale.set(0.7, 1, 1.5);
      thigh.tip.add(shin.pivot);
      shin.tip.add(foot.pivot);
      thigh.pivot.position.set(-0.34, -0.01, side * 0.075);
      body.add(thigh.pivot);
      return { thigh: thigh.pivot, shin: shin.pivot, foot: foot.pivot, toe: foot.tip };
    }

    const arms = [buildArm(1), buildArm(-1)];
    const legs = [buildLeg(1), buildLeg(-1)];
    swimmer.position.y = -0.1;
    scene.add(swimmer);

    // Arm angle: p = 0 reaching forward, pi/2 pulling under, pi at the hip, 3pi/2 recovering overhead.
    function poseArm(arm, p) {
      const w = ((p % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const pull = w < Math.PI ? Math.sin(w) : 0;
      const recover = w >= Math.PI ? Math.sin(w - Math.PI) : 0;
      const flex = w < Math.PI
        ? 1.4 * Math.sin(w) * (1 - w / Math.PI)
        : 2.0 * Math.pow(recover, 0.8);
      arm.upper.rotation.set(arm.side * (0.45 * recover + 0.18 * pull), 0, Math.PI / 2 - p);
      arm.fore.rotation.set(0, 0, -flex);
      return w;
    }

    // Six-beat flutter kick: the knee bends on the way up and snaps straight on the downbeat.
    // Hips roll about half as much as the shoulders, so the legs counter-rotate.
    function poseLeg(leg, k, roll) {
      const s = Math.sin(k);
      leg.thigh.rotation.set(-roll * 0.5, 0, -Math.PI / 2 + 0.14 + 0.16 * s);
      leg.shin.rotation.set(0, 0, -(0.04 + 0.3 * Math.pow(0.5 - 0.5 * s, 1.5)));
      leg.foot.rotation.set(0, 0, -0.08 - 0.14 * Math.cos(k));
    }

    // ---------- Bubbles and spray ----------
    const MAX_PARTS = 260;
    const partPos = new Float32Array(MAX_PARTS * 3);
    const partSize = new Float32Array(MAX_PARTS);
    const partAlpha = new Float32Array(MAX_PARTS);
    const partVel = new Float32Array(MAX_PARTS * 3);
    const partLife = new Float32Array(MAX_PARTS);
    const partMax = new Float32Array(MAX_PARTS);
    const partKind = new Uint8Array(MAX_PARTS);
    let nextPart = 0;
    const partGeo = new THREE.BufferGeometry();
    partGeo.setAttribute("position", new THREE.BufferAttribute(partPos, 3).setUsage(THREE.DynamicDrawUsage));
    partGeo.setAttribute("aSize", new THREE.BufferAttribute(partSize, 1).setUsage(THREE.DynamicDrawUsage));
    partGeo.setAttribute("aAlpha", new THREE.BufferAttribute(partAlpha, 1).setUsage(THREE.DynamicDrawUsage));
    const particles = new THREE.Points(
      partGeo,
      new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: { uScale: { value: 1 } },
        vertexShader: `
          uniform float uScale;
          attribute float aSize;
          attribute float aAlpha;
          varying float vAlpha;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vAlpha = aAlpha;
            gl_PointSize = aSize * uScale / -mv.z;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            float disc = smoothstep(0.5, 0.3, d);
            float rim = smoothstep(0.5, 0.38, d) - smoothstep(0.38, 0.2, d) * 0.55;
            gl_FragColor = vec4(vec3(0.9, 0.98, 1.0), max(disc * 0.55, rim) * vAlpha);
            #include <colorspace_fragment>
          }
        `,
      })
    );
    particles.frustumCulled = false;
    scene.add(particles);

    function emit(kind, pos, vx, vy, vz, life, size) {
      const i = nextPart;
      nextPart = (nextPart + 1) % MAX_PARTS;
      partPos.set([pos.x, pos.y, pos.z], i * 3);
      partVel.set([vx, vy, vz], i * 3);
      partLife[i] = life;
      partMax[i] = life;
      partSize[i] = size;
      partKind[i] = kind;
    }

    function splash(pos, count, power) {
      for (let n = 0; n < count; n += 1) {
        emit(1, { x: pos.x, y: 0.01, z: pos.z },
          (Math.random() - 0.7) * 0.6 * power, (0.5 + Math.random() * 0.9) * power,
          (Math.random() - 0.5) * 0.7 * power, 0.45 + Math.random() * 0.35, 0.9 + Math.random() * 1.1);
      }
    }

    function bubble(pos, spread) {
      emit(0, {
        x: pos.x + (Math.random() - 0.5) * spread,
        y: Math.min(pos.y, -0.03),
        z: pos.z + (Math.random() - 0.5) * spread,
      }, (Math.random() - 0.5) * 0.08, 0.2 + Math.random() * 0.3, (Math.random() - 0.5) * 0.08,
      0.9 + Math.random() * 1.2, 0.8 + Math.random() * 1.4);
    }

    function updateParticles(dt, speed, t) {
      for (let i = 0; i < MAX_PARTS; i += 1) {
        if (partLife[i] <= 0) {
          partAlpha[i] = 0;
          continue;
        }
        partLife[i] -= dt;
        const j = i * 3;
        if (partKind[i] === 1) {
          partVel[j + 1] -= 4.2 * dt;
        } else {
          partVel[j] += Math.sin(t * 6 + i) * 0.1 * dt;
        }
        partPos[j] += (partVel[j] - speed) * dt;
        partPos[j + 1] += partVel[j + 1] * dt;
        partPos[j + 2] += partVel[j + 2] * dt;
        const surfaced = partKind[i] === 0 ? partPos[j + 1] > -0.005 : partPos[j + 1] < 0 && partVel[j + 1] < 0;
        if (surfaced) partLife[i] = 0;
        const life = partLife[i] / partMax[i];
        partAlpha[i] = Math.max(0, Math.min(1, life * 2.5, (1 - life) * 8)) * (partKind[i] === 1 ? 0.9 : 0.6);
      }
      partGeo.attributes.position.needsUpdate = true;
      partGeo.attributes.aSize.needsUpdate = true;
      partGeo.attributes.aAlpha.needsUpdate = true;
    }

    // ---------- Animation ----------
    const TAU = Math.PI * 2;
    const ENTRY = TAU - 0.35;
    const EXIT = Math.PI + 0.15;
    const tmp = new THREE.Vector3();
    const clock = new THREE.Clock();
    const timeScale = reduceMotion ? 0.35 : 1;
    let t = 0;
    let phase = 0;
    let offset = 0;
    let visible = true;

    function crossed(prev, now, mark) {
      return prev < mark && now >= mark;
    }

    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.05) * timeScale;
      if (!visible) return;
      t += dt;
      phase += dt * 2.6;

      // Glide on the catch, hurry through the recovery.
      const armPhase = (a) => a - 0.3 * Math.sin(a);
      const pL = armPhase(phase);
      const pR = armPhase(phase + Math.PI);
      const speed = 0.62 * (1 + 0.08 * Math.sin(2 * phase - 1.2));
      offset += speed * dt;

      const roll = 0.5 * Math.sin(pL - 0.15);
      body.rotation.x = roll;
      body.rotation.z = 0.025 * Math.sin(2 * phase);
      body.position.y = 0.012 * Math.sin(2 * phase + 0.6);
      swimmer.position.x = 0.03 * Math.sin(2 * phase - 1.2);

      // Breathe to the camera side as the near arm recovers; otherwise hold the head still.
      const wL = ((pL % TAU) + TAU) % TAU;
      const breath = THREE.MathUtils.smoothstep(wL, Math.PI - 0.5, Math.PI + 0.1)
        * (1 - THREE.MathUtils.smoothstep(wL, Math.PI + 0.9, Math.PI + 1.7));
      headPivot.rotation.x = THREE.MathUtils.lerp(-roll * 0.85, -1.15 - roll, breath);
      headPivot.rotation.z = 0.12 * breath;

      [pL, pR].forEach((p, i) => {
        const arm = arms[i];
        const w = poseArm(arm, p);
        arm.hand.getWorldPosition(tmp);
        if (crossed(arm.prev, w, ENTRY)) splash(tmp, 9, 1);
        if (crossed(arm.prev, w, EXIT)) splash(tmp, 5, 0.7);
        if (w > 0.1 && w < Math.PI && tmp.y < -0.04 && Math.random() < 0.35) bubble(tmp, 0.05);
        arm.prev = w;
      });

      const kick = phase * 3;
      poseLeg(legs[0], kick, roll);
      poseLeg(legs[1], kick + Math.PI, roll);
      legs.forEach((leg) => {
        if (Math.random() < 0.3) {
          leg.toe.getWorldPosition(tmp);
          bubble(tmp, 0.12);
        }
      });

      if (breath < 0.05 && Math.random() < 0.18) {
        head.getWorldPosition(tmp);
        tmp.y -= 0.06;
        tmp.x += 0.05;
        bubble(tmp, 0.04);
      }

      updateParticles(dt, speed, t);
      updateRopes(t, offset);
      shared.uTime.value = t;
      shared.uOffset.value = offset;
      shared.uKick.value = kick;

      camera.position.set(
        camBase.x + Math.sin(t * 0.21) * 0.35,
        camBase.y + Math.sin(t * 0.17) * 0.06,
        camBase.z
      );
      camera.lookAt(-0.1, -0.22, 0);
      renderer.render(scene, camera);
    }

    function resize() {
      const width = window.innerWidth;
      const height = Math.max(window.innerHeight, 1);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      particles.material.uniforms.uScale.value = height * renderer.getPixelRatio() * 0.028;
    }

    if ("IntersectionObserver" in window) {
      new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }).observe(document.body);
    }
    window.addEventListener("resize", resize);
    resize();
    frame();
  </script>
</body>
</html>
